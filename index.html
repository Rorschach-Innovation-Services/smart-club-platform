    display:block;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;
    color:rgba(255,255,255,0.45);margin-bottom:4px;
  }
  .reg-checks{display:flex;gap:12px;flex-wrap:wrap}
  /* The reg card is dark, so the shared light-background checkbox/label colours are
     invisible here — force legible light text for the playing-profile + consent checks. */
  .reg-card .rp-check{color:rgba(255,255,255,0.86)}
  .reg-card .rp-check strong{color:#fff}
  .reg-card .rp-check.rp-pill{
    border:1px solid rgba(255,255,255,0.16);border-radius:10px;padding:9px 13px;
    background:rgba(255,255,255,0.04);transition:border-color .15s, background .15s;
  }
  .reg-card .rp-check.rp-pill:hover{border-color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.07)}
  @media (max-width:600px){
    .ps-card.reg-card{padding:24px 20px}
    .reg-grid{grid-template-columns:1fr}
  }

  .ps-card-icon{
    width:56px;height:56px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    position:relative;z-index:1;
  }
  .ps-card-icon svg{width:28px;height:28px}
  .ps-card.gold .ps-card-icon{background:var(--gold);color:var(--ink)}
  .ps-card.teal .ps-card-icon{background:var(--teal);color:#fff}

  .ps-card-role{
    font-family:'Montserrat',sans-serif;font-size:10.5px;
    letter-spacing:0.18em;text-transform:uppercase;
    color:rgba(255,255,255,0.45);position:relative;z-index:1;
  }
  .ps-card.gold .ps-card-role{color:var(--gold-mid)}
  .ps-card.teal .ps-card-role{color:var(--teal-mid)}

  .ps-card-title{
    font-family:'Montserrat',sans-serif;font-size:24px;font-weight:700;
    line-height:1.15;letter-spacing:-0.01em;position:relative;z-index:1;
  }
  .ps-card-desc{font-size:13.5px;color:rgba(255,255,255,0.6);line-height:1.6;position:relative;z-index:1}
  .ps-card-meta{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding-top:14px;border-top:1px solid rgba(255,255,255,0.08);
    position:relative;z-index:1;
  }
  .ps-card-stat{display:flex;flex-direction:column;gap:3px}
  .ps-card-stat-n{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:800;color:#fff;letter-spacing:-0.02em;line-height:1}
  .ps-card-stat-l{
    font-family:'Montserrat',sans-serif;font-size:9.5px;
    letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.4);
  }
  .ps-card-cta{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:6px;position:relative;z-index:1;
  }
  .ps-card-cta-text{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.04em;color:#fff}
  .ps-card-cta-arrow{
    width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,0.08);color:#fff;
    display:flex;align-items:center;justify-content:center;transition:all .2s;
  }
  .ps-card-cta-arrow svg{width:14px;height:14px}
  .ps-card:hover .ps-card-cta-arrow{background:#fff;color:var(--ink)}

  .ps-footer{
    position:relative;z-index:1;display:flex;align-items:center;gap:14px;
    font-family:'Montserrat',sans-serif;font-size:10.5px;
    letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.35);
  }
  .ps-footer .dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,0.25)}

  .h-switch{
    height:30px;padding:0 12px;border-radius:18px;
    background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
    color:rgba(255,255,255,0.7);font-family:'Montserrat',sans-serif;
    font-size:10px;letter-spacing:0.14em;text-transform:uppercase;
    display:flex;align-items:center;gap:6px;transition:all .12s;cursor:pointer;
  }
  .h-switch:hover{background:rgba(255,255,255,0.1);color:#fff}
  .h-switch svg{width:11px;height:11px}

  /* ─── AFFILIATION SUBMITTED (view-only state) ─── */
  .aff-submitted-banner{
    display:flex;align-items:center;gap:16px;
    margin-bottom:22px;padding:18px 22px;
    background:linear-gradient(90deg, var(--green-pale) 0%, rgba(232,240,235,0.4) 100%);
    border:1px solid var(--green);
    border-radius:14px;
    animation:fadeUp .4s cubic-bezier(0.16,1,0.3,1) both;
  }
  .aff-submitted-icon{
    width:44px;height:44px;border-radius:50%;
    background:var(--green);color:#fff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow:0 6px 18px rgba(15,77,46,0.25);
    animation:tickPop .55s cubic-bezier(0.34,1.56,0.64,1) both;
    animation-delay:.15s;
  }
  .aff-submitted-icon svg{width:22px;height:22px}
  @keyframes tickPop{
    from{transform:scale(0);opacity:0}
    50%{transform:scale(1.12);opacity:1}
    to{transform:scale(1);opacity:1}
  }
  .aff-submitted-text{flex:1;min-width:0}
  .aff-submitted-title{
    font-family:'Montserrat',sans-serif;font-size:15px;font-weight:800;
    color:var(--green);letter-spacing:-0.01em;
  }
  .aff-submitted-sub{
    font-family:'Montserrat',sans-serif;font-size:12px;font-weight:500;
    color:var(--green-mid);margin-top:3px;
  }

  /* Disabled-form styling: greyed out fields but still readable */
  .aff-locked fieldset[disabled]{border:0;padding:0;margin:0;min-width:0;display:block}
  .aff-locked fieldset[disabled] .field-input,
  .aff-locked fieldset[disabled] .field-select,
  .aff-locked fieldset[disabled] .field-textarea{
    background:var(--paper2);
    color:var(--ink3);
    cursor:not-allowed;
    border-color:var(--line2);
    opacity:0.85;
  }
  .aff-locked fieldset[disabled] .seg{opacity:0.7}
  .aff-locked fieldset[disabled] .seg-btn{cursor:not-allowed}
  .aff-locked fieldset[disabled] .check-item{cursor:not-allowed;opacity:0.75}
  .aff-locked fieldset[disabled] .trb-chip{cursor:not-allowed;opacity:0.85}
  .aff-locked fieldset[disabled] .num-slider-input{opacity:0.6;cursor:not-allowed}
  /* Hide "Drop pin" and "Add another" buttons in locked state */
  .aff-locked fieldset[disabled] button{cursor:not-allowed}
  .aff-locked fieldset[disabled] .ground-map{pointer-events:auto;opacity:1} /* still browsable */

  /* ─── ADMIN FIXTURES & VENUES ─── */
  .series-strip{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:14px;
    margin-bottom:24px;
  }
  .series-card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:18px 20px;cursor:pointer;
    transition:border-color .14s ease, transform .14s ease, box-shadow .14s ease;
    text-align:left;display:flex;flex-direction:column;gap:6px;
    animation:fadeUp .5s cubic-bezier(0.16,1,0.3,1) both;
  }
  .series-card:hover{border-color:var(--ink3);transform:translateY(-2px);box-shadow:0 10px 28px rgba(14,53,41,0.08)}
  .series-card.active{border-color:var(--green);box-shadow:0 0 0 3px rgba(15,77,46,0.10)}
  .series-card-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:6px;
  }
  .series-card-name{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-0.01em}
  .series-card-type{
    font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;
    letter-spacing:0.12em;text-transform:uppercase;color:var(--green);
    background:var(--green-pale);padding:3px 8px;border-radius:99px;
  }
  .series-card-meta{
    display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin-top:10px;
  }
  .series-card-stat{display:flex;flex-direction:column;gap:2px}
  .series-card-stat-l{font-family:'Montserrat',sans-serif;font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .series-card-stat-n{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-0.01em;line-height:1}
  .series-card-cta{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line2);display:flex;justify-content:flex-end}
  .series-card-btn{
    font-family:'Montserrat',sans-serif;font-size:11.5px;font-weight:700;
    letter-spacing:0.02em;padding:8px 14px;border-radius:8px;cursor:pointer;
    border:none;transition:background .15s ease, color .15s ease, transform .15s ease;
  }
  .series-card-btn.release{background:var(--green);color:#fff}
  .series-card-btn.release:hover{background:var(--ink);transform:translateY(-1px)}
  .series-card-btn.recall{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .series-card-btn.recall:hover{color:var(--ink);border-color:var(--ink)}

  .fix-header{
    background:var(--ink);color:#fff;border-radius:var(--radius-lg);
    padding:26px 32px;margin-bottom:22px;
    display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
    animation:fadeUp .42s cubic-bezier(0.16,1,0.3,1) both;
  }
  .fix-header-title{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:800;letter-spacing:-0.01em}
  .fix-header-title em{color:var(--green-bright);font-style:normal;font-weight:800}
  .fix-header-sub{font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-top:6px;font-weight:500}
  .fix-header-aggs{display:flex;gap:36px;flex-wrap:wrap}
  .fix-header-agg{display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right}
  .fix-header-agg-l{font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.55);font-weight:600;font-family:'Montserrat',sans-serif}
  .fix-header-agg-n{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:800;color:#fff;letter-spacing:-0.02em}
  .fix-header-agg-n .unit{font-size:11px;color:rgba(255,255,255,0.55);font-weight:500;letter-spacing:0;margin-left:3px}

  .fix-table-wrap{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);
    overflow-x:auto;overflow-y:hidden;
  }
  .fix-table{width:100%;min-width:720px;border-collapse:collapse;font-family:'Montserrat',sans-serif}
  .fix-table thead{background:var(--ink);color:#fff}
  .fix-table thead th{
    font-size:9.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;
    padding:14px 18px;text-align:left;color:rgba(255,255,255,0.7);
  }
  .fix-table th:first-child,.fix-table td:first-child{padding-left:24px}
  .fix-table th:last-child,.fix-table td:last-child{padding-right:24px}
  .fix-table tbody tr{border-bottom:1px solid var(--line2);transition:background .1s}
  .fix-table tbody tr:last-child{border-bottom:none}
  .fix-table tbody tr:hover{background:var(--paper)}
  .fix-table td{padding:15px 18px;font-size:12.5px;vertical-align:middle;color:var(--ink)}
  .fix-row-rd{
    font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;
    background:var(--paper);color:var(--ink);padding:3px 8px;border-radius:6px;
    letter-spacing:0.1em;display:inline-block;
  }
  .fix-row-date{font-family:'Montserrat',sans-serif;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:0.04em}
  .fix-row-time{font-size:10.5px;color:var(--muted);font-weight:500;margin-top:1px}
  /* Medicoach result under the status pill (read-only, ADR 0016) */
  .fix-row-result{margin-top:4px;display:flex;flex-direction:column;gap:1px}
  .fix-row-result-score{font-size:11.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .fix-row-result-summary{font-size:10.5px;color:var(--muted)}
  .fix-row-result-link{font-size:10.5px;font-weight:600;color:var(--green);text-decoration:none}
  .fix-row-result-link:hover{text-decoration:underline}
  .fix-row-team{display:flex;align-items:center;gap:8px}
  .fix-row-team-name{font-weight:700;font-size:13px}
  .fix-row-team-sub{font-size:10.5px;color:var(--muted);font-weight:500;margin-top:1px}
  .fix-row-venue{display:flex;flex-direction:column;gap:1px}
  .fix-row-venue-name{font-weight:600;font-size:12px;color:var(--ink)}
  .fix-row-venue-suburb{font-size:10.5px;color:var(--muted);font-weight:500}
  .fix-venue-reason{margin-left:5px;padding:0 5px;border-radius:4px;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;color:var(--muted);background:var(--wash, rgba(0,0,0,0.05));white-space:nowrap;cursor:help}
  .fix-row-dist{
    font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;color:var(--ink);
    letter-spacing:-0.01em;
  }
  .fix-row-dist .unit{font-size:9.5px;font-weight:600;color:var(--muted);margin-left:2px}
  .fix-totals{
    background:var(--paper);
    padding:16px 24px;
    display:flex;align-items:center;justify-content:flex-end;gap:32px;
    border-top:1px solid var(--line);
    flex-wrap:wrap;
  }
  .fix-totals-item{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
  .fix-totals-l{font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:700;font-family:'Montserrat',sans-serif}
  .fix-totals-n{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-0.02em}

  /* Fixture status badges + action buttons */
  .fix-status{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 9px;border-radius:99px;
    font-family:'Montserrat',sans-serif;font-size:9.5px;font-weight:700;
    letter-spacing:0.12em;text-transform:uppercase;
    border:1px solid transparent;
  }
  .fix-status::before{
    content:'';width:5px;height:5px;border-radius:50%;
  }
  .fix-status.scheduled{background:var(--paper2);color:var(--ink);border-color:var(--line)}
  .fix-status.scheduled::before{background:var(--ink3)}
  .fix-status.completed{background:var(--green-pale);color:var(--green)}
  .fix-status.completed::before{background:var(--green)}
  .fix-status.postponed{background:#F5EFD8;color:#6E5618;border-color:rgba(110,86,24,0.18)}
  .fix-status.postponed::before{background:#6E5618}
  .fix-status.cancelled{background:#F5DBD7;color:#6B1F1A;border-color:rgba(107,31,26,0.18)}
  .fix-status.cancelled::before{background:#6B1F1A}

  .fix-row-actions{
    display:flex;gap:4px;justify-content:flex-end;
    opacity:0;transition:opacity .14s ease;
  }
  .fix-table tbody tr:hover .fix-row-actions{opacity:1}
  .fix-action-btn{
    width:28px;height:28px;border-radius:6px;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);transition:all .12s;cursor:pointer;
  }
  .fix-action-btn:hover{background:var(--paper2);color:var(--ink)}
  .fix-action-btn.danger:hover{background:rgba(107,31,26,0.1);color:#6B1F1A}
  .fix-action-btn svg{width:13px;height:13px}

  /* Edit row */
  .fix-edit-tr{background:var(--paper) !important}
  .fix-edit-tr td{padding:14px 14px !important}
  .fix-edit-grid{
    display:grid;
    grid-template-columns:90px 1fr 1fr 1fr 110px auto;
    gap:10px;align-items:end;
  }
  .fix-edit-field{display:flex;flex-direction:column;gap:4px}
  .fix-edit-field label{
    font-family:'Montserrat',sans-serif;font-size:9.5px;font-weight:700;
    letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);
  }
  .fix-edit-field input,.fix-edit-field select{
    height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;
    font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:500;
    background:var(--white);color:var(--ink);
  }
  .fix-edit-field input:focus,.fix-edit-field select:focus{
    border-color:var(--green);outline:none;
    box-shadow:0 0 0 3px rgba(31,170,92,0.18);
  }
  .fix-edit-actions{display:flex;gap:6px;align-self:end}

  /* Umpire allocation — fixture-table cell + picker, admin Umpires page */
  .ump-cell{position:relative;font-family:'Montserrat',sans-serif;font-size:12px}
  .ump-names{display:flex;align-items:center;gap:4px;flex-wrap:wrap;color:var(--ink);font-weight:600}
  .ump-none{color:var(--muted-2,var(--muted));font-weight:500}
  .ump-warn{color:var(--gold-deep,#9a6a00);cursor:help}
  .ump-edit{width:24px;height:24px;margin-left:2px}
  .ump-picker{
    position:absolute;z-index:30;top:calc(100% + 4px);right:0;width:260px;
    background:var(--white);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);padding:10px;display:flex;flex-direction:column;gap:8px;
  }
  .ump-slot{display:flex;flex-direction:column;gap:4px}
  .ump-slot-l{
    display:flex;flex-direction:column;gap:4px;font-size:9.5px;font-weight:700;
    letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);
  }
  .ump-slot input,.ump-form-field input,.ump-merge select{
    height:32px;border:1px solid var(--line);border-radius:6px;padding:0 10px;
    font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:500;
    background:var(--white);color:var(--ink);text-transform:none;letter-spacing:0;
  }
  .ump-chip{
    display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
    background:var(--paper2);border-radius:999px;padding:3px 4px 3px 10px;font-weight:600;font-size:12px;
  }
  .ump-chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0 4px}
  .ump-options{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .ump-options button{
    text-align:left;border:0;background:var(--white);padding:6px 10px;cursor:pointer;
    font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;color:var(--ink);
  }
  .ump-options button:hover{background:var(--paper2)}
  .ump-option-sub{color:var(--muted);font-weight:500}
  .ump-add{color:var(--green) !important}
  .ump-warn-box{background:rgba(201,151,0,0.1);border-radius:6px;padding:8px;font-size:11.5px;color:var(--ink)}
  .ump-warn-sub{color:var(--muted);margin-top:4px}
  .ump-picker-actions,.ump-form-actions,.ump-row-actions,.ump-merge{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
  .ump-row-actions{flex-wrap:nowrap}
  .ump-num{text-align:right}
  .ump-form{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg,10px);padding:14px;margin-top:14px;
  }
  .ump-form-field{
    display:flex;flex-direction:column;gap:4px;font-family:'Montserrat',sans-serif;font-size:9.5px;
    font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);
  }
  .ump-sub{font-size:11px;color:var(--muted)}
  .ump-empty{padding:28px !important;text-align:center;color:var(--muted);font-size:13px}
  .ump-footnote{font-size:11.5px;color:var(--muted);margin-top:10px}
  /* Medicoach sync admin page (ADR 0016) */
  .mcs-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .mcs-stat{background:var(--white,#fff);border:1px solid var(--line,#e6e8ee);border-radius:10px;padding:14px 16px}
  .mcs-stat-label{font-family:'Montserrat',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--muted)}
  .mcs-stat-value{font-size:20px;font-weight:700;color:var(--ink);margin:4px 0 2px}
  .mcs-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
  .mcs-heading{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;color:var(--ink);margin:24px 0 0}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .mcs-health{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:var(--white,#fff);border:1px solid var(--line,#e6e8ee);border-radius:10px;padding:16px 18px;margin-bottom:12px}
  .mcs-health-value{font-size:22px;font-weight:700;color:var(--ink);margin-top:4px}
  .mcs-health-ago{font-size:13px;font-weight:600;color:var(--muted)}
  .mcs-muted{color:var(--muted);font-size:16px}
  .mcs-alert{margin:0 0 12px}
  .mcs-empty{padding:16px;margin-top:10px;border:1px dashed var(--line,#e6e8ee);border-radius:10px;color:var(--muted);font-size:13px;background:var(--white,#fff)}
  .mcs-cards{display:grid;gap:12px;margin-top:10px}
  .mcs-card{background:var(--white,#fff);border:1px solid var(--line,#e6e8ee);border-radius:10px;padding:14px 16px;min-width:0}
  .mcs-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .mcs-card-title{font-weight:700;color:var(--ink);font-size:13.5px}
  .mcs-card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .mcs-compare{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
  .mcs-compare th,.mcs-compare td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line,#e6e8ee);overflow-wrap:anywhere;vertical-align:top}
  .mcs-compare thead th{font-family:'Montserrat',sans-serif;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)}
  .mcs-compare thead th:first-child,.mcs-compare tbody th{width:22%}
  .mcs-compare tbody th{font-weight:600;color:var(--muted)}
  .mcs-compare tr.mcs-diff td{font-weight:700;color:var(--ink);background:rgba(201,151,0,0.08)}
  .mcs-reason{font-size:12.5px;color:var(--ink);margin-top:10px;line-height:1.5}
  .mcs-reason ul{margin:4px 0 0;padding-left:18px;color:var(--muted)}
  .mcs-note{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.5}
  .mcs-kv{display:flex;gap:8px;font-size:12.5px}
  .mcs-kv-l{color:var(--muted);flex:none}
  .mcs-wrap{overflow-wrap:anywhere}
  .mcs-error-text{font-size:12.5px;color:#5A1815;margin:6px 0 0;line-height:1.5}
  .mcs-details{font-size:12px;color:var(--muted);margin-top:6px}
  .mcs-details summary{cursor:pointer;font-weight:600;color:var(--ink);width:max-content}
  .mcs-details summary:focus-visible,.mcs-link:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:3px}
  .mcs-details-body{margin-top:4px;overflow-wrap:anywhere}
  .mcs-details code,.mcs-note code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .mcs-list{list-style:none;margin:10px 0 0;padding:0;background:var(--white,#fff);border:1px solid var(--line,#e6e8ee);border-radius:10px}
  .mcs-list>li{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 16px;border-top:1px solid var(--line,#e6e8ee);min-width:0}
  .mcs-list>li:first-child{border-top:0}
  .mcs-link{font-size:12.5px;font-weight:600;color:var(--green);white-space:nowrap}
  .mcs-log>li{justify-content:flex-start}
  .mcs-log-when{flex:0 0 110px;font-size:12.5px}
  .mcs-log-what{flex:1;min-width:0;font-size:12.5px;overflow-wrap:anywhere}
  .resync-list{max-height:min(40vh,320px);overflow:auto;border:1px solid var(--line,#e6e8ee);border-radius:8px}
  .resync-list .mcs-compare thead th{position:sticky;top:0;background:var(--white,#fff)}
  .resync-list .mcs-compare thead th:first-child{width:auto}
  /* Captain's reports date range: wrap instead of running off a phone screen (UX pass) */
  .cr-range{flex-wrap:wrap}
  .cr-range input{max-width:100%}
  /* Upload appointments (admin, Umpires) */
  .upl-pick{display:flex;flex-direction:column;gap:6px;background:var(--white,#fff);border:1px solid var(--line,#e6e8ee);border-radius:10px;padding:14px 16px}
  .upl-label{font-weight:700;font-size:13px;color:var(--ink)}
  .upl-pick input[type=file]{font-size:12.5px;max-width:100%}
  .upl-pick input[type=file]:focus-visible,.upl-check input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .upl-pick input[type=file]::file-selector-button{font:inherit;font-weight:600;font-size:11.5px;padding:6px 11px;margin-right:10px;
    border-radius:8px;border:1px solid var(--line,#e6e8ee);background:#fff;color:var(--ink);cursor:pointer}
  @media (max-width:640px){
    .upl-tbl{min-width:0 !important}
    .upl-tbl thead{display:none}
    .upl-tbl tr{display:block;padding:10px 12px;border-top:1px solid var(--line,#e6e8ee)}
    .upl-tbl tbody tr:first-child{border-top:0}
    .upl-tbl td[data-label]{padding-left:92px !important}
    .upl-tbl .ump-num{text-align:left}
    .upl-tbl .ump-row-actions,.upl-tbl .ump-merge{justify-content:flex-start;flex-wrap:wrap}
    .upl-tbl td{display:block;position:relative;padding:3px 0 !important;border:0 !important;overflow-wrap:anywhere}
    .upl-tbl td::before{content:attr(data-label);position:absolute;left:0;top:5px;width:84px;color:var(--muted);font-size:10px;
      font-weight:700;letter-spacing:0.08em;text-transform:uppercase}
  }
  .upl-names{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .upl-check{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .upl-check input{width:16px;height:16px}
  .upl-confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 8px;position:sticky;bottom:0;
    background:var(--paper,#f6f7f9);padding:10px 0;border-top:1px solid var(--line,#e6e8ee)}
  .mcs-card a,.ph-crumb a{color:var(--green);font-weight:600;text-decoration:none}
  .mcs-card a:hover,.ph-crumb a:hover{text-decoration:underline}
  @media (max-width:640px){
    .mcs-stats{grid-template-columns:1fr 1fr;gap:8px}
    .mcs-stat{padding:10px 12px}
    .mcs-list>li{flex-direction:column;gap:6px}
    .mcs-log-when{flex:none;display:flex;gap:8px;align-items:baseline}
    .mcs-link{white-space:normal}
    .mcs-card-actions .btn{flex:1 1 auto;justify-content:center}
  }

  .fix-toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:14px 20px;background:var(--white);
    border:1px solid var(--line);border-radius:var(--radius-lg);
    margin-bottom:18px;
  }
  .fix-toolbar-left{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap}
  .fix-toolbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fix-toolbar .filter-pill{height:30px}

  /* Release bar — bottom-right CTA to publish fixtures to clubs */
  .fix-release-bar{
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    padding:20px 26px;margin-top:18px;
    background:var(--ink);color:#fff;border-radius:var(--radius-lg);
    flex-wrap:wrap;
    box-shadow:0 12px 36px rgba(10,15,20,0.18);
    animation:fadeUp .42s cubic-bezier(0.16,1,0.3,1) both;
    position:relative;overflow:hidden;
  }
  .fix-release-bar::before{
    content:'';position:absolute;top:-50px;right:-40px;width:180px;height:180px;
    border-radius:50%;background:rgba(75,138,108,0.18);
    pointer-events:none;
  }
  .fix-release-bar.released{background:var(--green)}
  .fix-release-bar.released::before{background:rgba(255,255,255,0.10)}
  .fix-release-text{position:relative;z-index:1;flex:1;min-width:240px}
  .fix-release-eyebrow{
    font-family:'Montserrat',sans-serif;font-size:9.5px;font-weight:700;
    letter-spacing:0.18em;text-transform:uppercase;color:var(--gold-mid);
    display:inline-flex;align-items:center;gap:8px;margin-bottom:6px;
  }
  .fix-release-bar.released .fix-release-eyebrow{color:rgba(255,255,255,0.7)}
  .fix-release-eyebrow::before{
    content:'';width:14px;height:1.5px;background:currentColor;
  }
  .fix-release-text-title{
    font-family:'Montserrat',sans-serif;font-size:16px;font-weight:800;
    color:#fff;letter-spacing:-0.01em;line-height:1.25;
  }
  .fix-release-text-sub{
    font-family:'Montserrat',sans-serif;font-size:12px;font-weight:500;
    color:rgba(255,255,255,0.65);margin-top:5px;line-height:1.5;max-width:520px;
  }
  .fix-release-actions{position:relative;z-index:1;display:flex;align-items:center;gap:10px}
  .fix-release-actions .btn-teal{
    background:var(--green-bright);color:var(--ink);
    padding:13px 22px;font-size:13px;font-weight:800;letter-spacing:0.02em;
  }
  .fix-release-actions .btn-teal:hover{background:#fff;color:var(--ink)}
  .fix-release-bar.released .fix-release-actions .btn-outline{
    background:transparent;color:#fff;border-color:rgba(255,255,255,0.3);
  }
  .fix-release-bar.released .fix-release-actions .btn-outline:hover{
    background:rgba(255,255,255,0.1);border-color:#fff;
  }

  /* RELEASED pill on series cards strip */
  .series-card-released{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 9px;border-radius:99px;
    background:var(--green);color:#fff;
    font-family:'Montserrat',sans-serif;font-size:9.5px;font-weight:700;
    letter-spacing:0.12em;text-transform:uppercase;
  }
  .series-card-released::before{
    content:'';width:5px;height:5px;border-radius:50%;background:var(--green-bright);
    animation:pulseDot 2.2s ease-in-out infinite;
  }
  .series-card-draft{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 9px;border-radius:99px;
    background:var(--paper2);color:var(--muted);
    font-family:'Montserrat',sans-serif;font-size:9.5px;font-weight:700;
    letter-spacing:0.12em;text-transform:uppercase;
  }

  /* ─── Club-side Fixtures view ─── */
  .club-fix-empty{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:64px 40px;text-align:center;
    animation:fadeUp .42s cubic-bezier(0.16,1,0.3,1) both;
  }
  .club-fix-empty-icon{
    width:84px;height:84px;margin:0 auto 22px;border-radius:50%;
    background:var(--paper);border:1.5px dashed var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--muted);
  }
  .club-fix-empty-icon svg{width:36px;height:36px}
  .club-fix-empty-title{
    font-family:'Montserrat',sans-serif;font-size:19px;font-weight:800;
    color:var(--ink);letter-spacing:-0.01em;margin-bottom:10px;
  }
  .club-fix-empty-sub{
    font-family:'Montserrat',sans-serif;font-size:13px;color:var(--muted);
    line-height:1.7;max-width:520px;margin:0 auto 18px;
  }
  .club-fix-empty-meta{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Montserrat',sans-serif;font-size:11.5px;color:var(--muted-2);
    background:var(--paper);padding:7px 14px;border-radius:99px;
  }
  .club-fix-empty-meta .sdot{width:7px;height:7px;border-radius:50%;background:var(--gold);}
  .club-fix-empty-meta strong{color:var(--ink);font-weight:700;margin-left:2px}

  .club-fix-kpis{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;
    animation:fadeUp .42s cubic-bezier(0.16,1,0.3,1) both;
  }
  .club-fix-kpi{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:16px 18px;position:relative;overflow:hidden;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .club-fix-kpi:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(10,15,20,0.08)}
  .club-fix-kpi-l{
    font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--muted-2);margin-bottom:8px;
  }
  .club-fix-kpi-n{
    font-family:'Montserrat',sans-serif;font-size:32px;font-weight:800;
    color:var(--ink);letter-spacing:-0.03em;line-height:1;
  }
  .club-fix-kpi-meta{
    font-family:'Montserrat',sans-serif;font-size:11px;color:var(--muted);
    margin-top:8px;font-weight:500;
  }

  .club-fix-next{
    background:linear-gradient(135deg, var(--green) 0%, var(--green-deep, #0F4D2E) 100%);
    border-radius:var(--radius-lg);padding:20px 24px;
    color:#fff;margin:14px 0;position:relative;overflow:hidden;
    animation:fadeUp .5s cubic-bezier(0.16,1,0.3,1) both;
  }
  .club-fix-next::before{
    content:'';position:absolute;right:-60px;top:-60px;
    width:220px;height:220px;border-radius:50%;
    background:rgba(255,255,255,0.06);pointer-events:none;
  }
  .club-fix-next-eyebrow{
    font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;
    letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.65);
    margin-bottom:8px;position:relative;z-index:1;
  }
  .club-fix-next-body{display:flex;align-items:center;gap:22px;flex-wrap:wrap;position:relative;z-index:1}
  .club-fix-next-day{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:84px;height:84px;border-radius:50%;
    background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.2);
    flex-shrink:0;
  }
  .club-fix-next-day-n{
    font-family:'Montserrat',sans-serif;font-size:30px;font-weight:800;
    color:#fff;line-height:1;letter-spacing:-0.03em;
  }
  .club-fix-next-day-l{
    font-family:'Montserrat',sans-serif;font-size:9.5px;font-weight:700;
    color:rgba(255,255,255,0.7);letter-spacing:0.15em;text-transform:uppercase;margin-top:3px;
  }
  .club-fix-next-detail{flex:1;min-width:200px}
  .club-fix-next-title{
    font-family:'Montserrat',sans-serif;font-size:18px;font-weight:600;
    color:#fff;letter-spacing:-0.01em;
  }
  .club-fix-next-title strong{font-weight:800}
  .club-fix-next-sub{
    font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:500;
    color:rgba(255,255,255,0.7);margin-top:4px;
  }
  .club-fix-next-tag{flex-shrink:0}

  /* Season-run grouping header (ADR 0008) — one heading above the several series a
     structured season materialises into, so a split league reads as one thing. */
  .club-fix-run-head{
    font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted-2);margin:20px 0 8px;
  }
  .club-fix-series{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);
    margin-top:14px;overflow:hidden;
    animation:fadeUp .42s cubic-bezier(0.16,1,0.3,1) both;
  }
  .club-fix-series-head{
    padding:18px 22px;border-bottom:1px solid var(--line2);
    display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;
  }
  .club-fix-series-eyebrow{
    font-family:'Montserrat',sans-serif;font-size:9.5px;font-weight:700;
    letter-spacing:0.16em;text-transform:uppercase;color:var(--green);margin-bottom:4px;
  }
  .club-fix-series-name{
    font-family:'Montserrat',sans-serif;font-size:18px;font-weight:800;
    color:var(--ink);letter-spacing:-0.01em;
  }
  .club-fix-series-meta{
    font-family:'Montserrat',sans-serif;font-size:11.5px;color:var(--muted);
    margin-top:4px;font-weight:500;
  }
  .club-fix-series-tags{display:flex;gap:6px;flex-wrap:wrap}
  .club-fix-series .tbl-w{border:none;border-radius:0;background:transparent}

  .club-fix-foot{
    margin-top:18px;padding:14px 18px;
    background:var(--paper);border-radius:10px;border:1px dashed var(--line);
    font-family:'Montserrat',sans-serif;font-size:11.5px;color:var(--muted);
    line-height:1.6;text-align:center;
  }

  @media (max-width:980px){
    .club-fix-kpis{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:560px){
    .club-fix-kpis{grid-template-columns:1fr}
    .club-fix-next-body{gap:14px}
    .club-fix-next-day{width:68px;height:68px}
    .club-fix-next-day-n{font-size:24px}
  }

  /* Confirmation popover — portaled to body so it perfectly centers regardless of parent transforms */
  .fix-confirm{
    position:fixed;inset:0;background:rgba(10,15,20,0.55);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;
    animation:fadeIn .25s ease;
  }
  .fix-confirm-box{
    background:var(--white);border-radius:18px;padding:32px 30px 26px;
    max-width:460px;width:100%;text-align:center;
    box-shadow:0 30px 80px rgba(10,15,20,0.4);
    animation:slideUp .35s cubic-bezier(0.16,1,0.3,1);
    position:relative;
  }
  .fix-confirm-icon{
    width:64px;height:64px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
  }
  .fix-confirm-icon.go{
    background:var(--green-pale);color:var(--green);
    box-shadow:0 0 0 6px rgba(31,170,92,0.10);
  }
  .fix-confirm-icon.danger{
    background:#F5DBD7;color:#6B1F1A;
    box-shadow:0 0 0 6px rgba(107,31,26,0.08);
  }
  .fix-confirm-icon svg{width:30px;height:30px}
  .fix-confirm-title{
    font-family:'Montserrat',sans-serif;font-size:20px;font-weight:800;
    color:var(--ink);letter-spacing:-0.015em;margin-bottom:10px;line-height:1.25;
  }
  .fix-confirm-body{
    font-family:'Montserrat',sans-serif;font-size:13.5px;color:var(--muted);
    line-height:1.65;margin-bottom:24px;max-width:380px;margin-left:auto;margin-right:auto;
  }
  .fix-confirm-actions{
    display:flex;justify-content:center;gap:10px;
    padding-top:18px;border-top:1px solid var(--line2);
  }
  .fix-confirm-actions .btn{padding:11px 22px;font-size:13px;font-weight:700}
  .fix-confirm-actions .btn-teal{background:var(--green);color:#fff}
  .fix-confirm-actions .btn-teal:hover{background:var(--ink)}

  /* Create-series form layout */
  .cs-form{display:grid;grid-template-columns:1fr;gap:6px}
  .cs-row{
    display:grid;grid-template-columns:240px 1fr;align-items:center;gap:18px;
    padding:10px 0;border-bottom:1px solid var(--line2);
  }
  .cs-row:last-child{border-bottom:none}
  .cs-row-label{
    font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:600;color:var(--ink);
  }
  .cs-row-label .req{color:var(--green-bright);font-weight:700;margin-left:2px}
  .cs-row-input{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .cs-row-input .field-input,.cs-row-input .field-select{height:38px;font-size:13px}
  .cs-row-input input[type="date"]{height:38px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;background:var(--white);color:var(--ink)}
  .cs-row-multi{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .cs-row-multi-item{display:flex;flex-direction:column;gap:4px}
  .cs-row-multi-item label{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)}
  .cs-row-multi-item input{width:72px;height:36px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:13px;font-weight:600;font-family:'Montserrat',sans-serif}
  .cs-section{
    margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  }
  .cs-section-title{
    font-family:'Montserrat',sans-serif;font-size:10.5px;font-weight:700;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--green);margin-bottom:6px;
  }
  .cs-points-list{
    display:flex;flex-direction:column;gap:6px;width:280px;
  }
  .cs-points-row{
    display:flex;align-items:center;gap:8px;
    padding:8px 12px;border:1.5px solid var(--green);border-radius:8px;
    background:var(--white);
    font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;color:var(--ink);
    cursor:grab;
    transition:background .14s, transform .14s;
  }
  .cs-points-row:hover{background:var(--green-pale)}
  .cs-points-row .order-num{
    font-size:10px;font-weight:700;color:var(--green);
    background:var(--green-pale);
    padding:2px 7px;border-radius:6px;letter-spacing:0.06em;
  }
  .cs-points-grip{margin-left:auto;color:var(--muted-2);font-size:14px;line-height:1}
  .cs-teams-grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));gap:6px;
  }
  .cs-team-chip{
    padding:7px 11px;border:1.5px solid var(--line);border-radius:99px;
    background:var(--white);
    font-family:'Montserrat',sans-serif;font-size:11.5px;font-weight:600;
    color:var(--ink);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:all .14s;text-align:left;
  }
  .cs-team-chip:hover{border-color:var(--ink)}
  .cs-team-chip.on{background:var(--green);color:#fff;border-color:var(--green)}
  .cs-team-chip svg{width:11px;height:11px}

  @media (max-width: 768px){
    .cs-row{grid-template-columns:1fr;gap:6px}
    .fix-header{padding:18px 20px}
    .fix-header-aggs{width:100%}
    .fix-table{min-width:760px}
    .fix-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  }

  /* ─── COHORT INSIGHTS PANEL (Admin → All Clubs) ─── */
  .insights-panel{
    display:grid;grid-template-columns:repeat(3, 1fr);gap:14px;
    margin-bottom:22px;
  }
  .insights-card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:18px 20px;
    display:flex;flex-direction:column;gap:4px;
    animation:fadeUp .5s cubic-bezier(0.16,1,0.3,1) both;
  }
  .insights-card:nth-child(1){animation-delay:.05s}
  .insights-card:nth-child(2){animation-delay:.12s}
  .insights-card:nth-child(3){animation-delay:.19s}
  .insights-card-head{
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    margin-bottom:12px;
  }
  .insights-card-title{
    font-family:'Montserrat',sans-serif;font-size:10.5px;font-weight:700;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--ink);
  }
  .insights-card-meta{
    font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;
    color:var(--muted);letter-spacing:0.04em;
    white-space:nowrap;flex-shrink:0;
  }
  .insights-bar-row{
    display:grid;grid-template-columns:74px 1fr 38px;
    align-items:center;gap:10px;
    padding:5px 0;
  }
  .insights-bar-row.wide-label{grid-template-columns:130px 1fr 44px}
  .insights-bar-label{
    font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;
    color:var(--ink);letter-spacing:0.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .insights-bar-track{
    position:relative;height:9px;background:var(--paper2);
    border-radius:99px;overflow:hidden;
  }
  .insights-bar-fill{
    /* display:block — inside a clickable (button) row the fills are <span>s; inline
       boxes ignore height:100%, so blockify them (no-op for the plain div rows). */
    display:block;
    height:100%;background:var(--green);border-radius:99px;
    transform-origin:left;
    animation:barGrow .9s cubic-bezier(0.16,1,0.3,1) both;
    animation-delay:.2s;
  }
  .insights-bar-fill.warn{background:#6E5618}
  .insights-bar-fill.danger{background:#6B1F1A}
  .insights-bar-fill.pending{background:var(--muted-3)}
  .insights-bar-num{
    font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;
    color:var(--ink);text-align:right;letter-spacing:-0.01em;
  }
  @keyframes barGrow{from{width:0 !important}}

  .insights-callout{
    margin-top:12px;padding:10px 12px;
    background:var(--paper2);border-radius:8px;
    font-family:'Montserrat',sans-serif;font-size:11px;
    color:var(--muted);font-weight:500;line-height:1.55;
  }
  .insights-callout strong{color:var(--ink);font-weight:700}
  .insights-callout.alert{background:rgba(107,31,26,0.06);color:#5A1815}
  .insights-callout.alert strong{color:#6B1F1A}
  .insights-callout.warn{background:#FBF5E0;color:#6E5618}
  .insights-callout.warn strong{color:#5A4612}
  .insights-callout.good{background:var(--green-pale);color:var(--green)}
  .insights-callout.good strong{color:var(--green)}

  /* Insights page: long league/district lists scroll inside their card, with a
     bottom fade so cut-off rows read as "more below" rather than missing. */
  .insights-scroll{max-height:340px;overflow-y:auto;margin:0 -4px;padding:0 4px}
  .insights-scroll::after{
    content:'';position:sticky;bottom:0;display:block;height:26px;margin-top:-26px;
    background:linear-gradient(to bottom,rgba(255,255,255,0),var(--white));
    pointer-events:none;
  }
  .insights-group-label{
    font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;
    letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);
    padding:8px 0 2px;
  }
  /* Per-row honesty note under a league with fixtures but no club entered. */
  .insights-row-hint{
    font-family:'Montserrat',sans-serif;font-size:10.5px;font-weight:500;
    color:var(--muted);line-height:1.5;padding:0 0 6px 4px;margin-top:-2px;
  }
  /* Dual-value rows (clubs solid, teams tinted) — one shared scale per card.
     Tighter label/num columns than wide-label: the track needs the room. */
  .insights-bar-row.duo{grid-template-columns:118px 1fr 24px 30px;gap:8px}
  .insights-bar-fill.ghost{position:absolute;inset:0 auto 0 0;opacity:.22}
  /* Teams fewer than clubs (clubs without league entries): the ghost flips to a
     white overlay that LIGHTENS the covered clubs segment — still "tinted = teams". */
  .insights-bar-fill.ghost.inset{background:var(--white);opacity:.55}
  .insights-bar-num.sub{color:var(--muted);font-weight:600;font-size:12px}
  .insights-legend{
    display:flex;gap:12px;align-items:center;white-space:nowrap;flex-shrink:0;
    font-family:'Montserrat',sans-serif;font-size:10.5px;font-weight:600;
    color:var(--muted);letter-spacing:0.04em;
  }
  .insights-legend i{
    display:inline-block;width:8px;height:8px;border-radius:99px;
    background:var(--green);margin-right:5px;
  }
  .insights-legend i.ghost{opacity:.22}
  .insights-card:nth-child(4){animation-delay:.26s}
  .insights-card:nth-child(5){animation-delay:.33s}
  .insights-card:nth-child(6){animation-delay:.40s}
  .insights-card:nth-child(7){animation-delay:.47s}

  /* Clickable league rows (drill-down): the row is a native <button> — reset the UA
     chrome so it renders identically to the plain div rows, then add quiet affordance. */
  button.insights-bar-row{
    appearance:none;background:none;border:0;font:inherit;color:inherit;
    width:100%;text-align:left;
  }
  .insights-bar-row.clickable{
    cursor:pointer;margin:0 -4px;padding:5px 4px;border-radius:6px;
    transition:background .15s ease;
  }
  .insights-bar-row.clickable:hover{background:var(--paper2)}
  .insights-bar-row.clickable:focus-visible{outline:2px solid var(--green);outline-offset:-2px}

  /* League drill-down: compact KPI strip inside the directory card. */
  .kpi-strip.mini{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
  .kpi-strip.mini .kpi{padding:12px 14px}
  .kpi-strip.mini .kpi-l{margin-bottom:6px}
  .kpi-strip.mini .kpi-n{font-size:22px}
  .kpi-strip.mini .kpi-sub{margin-top:4px}

  /* League drill-down renders two cards, not the cohort page's 3–7, so it gets its own
     proportions: the data-dense directory takes the width; demographics sits in a
     comfortable sidebar instead of leaving an empty third column.
     NB: the cohort .insights-panel media queries below (repeat(2,1fr) ≤1360px; 1fr
     ≤768px, plus a :last-child:nth-child(odd) span-2 rule) still apply. This modifier
     (0,2,0) overrides the base grid at every width; the span-2 rule only matches an
     ODD-indexed last card — never the 2-card case (demographics is child 2). */
  .insights-panel.league-detail{
    grid-template-columns:minmax(0,1.7fr) minmax(300px,380px);
    align-items:start; /* cards size to content — no stretched empty demographics card */
  }
  /* Single-child cases (demographics absent, or a no-teams EmptyState with no demo) go
     full-width instead of sitting at 1.7fr with a dead 380px column. This rule is what
     governs the lone card ABOVE 1360px, and the EmptyState element (not an .insights-card)
     at every width. Below 1360px a lone .insights-card is instead handled by the cohort
     span-2 rule (:last-child:nth-child(odd), 0,4,0) — same full-width result. */
  .insights-panel.league-detail > :only-child{grid-column:1 / -1}
  .insights-panel.league-detail .insights-group-label{padding-top:12px}
  @media (max-width: 900px){
    /* Stack earlier than the cohort 768px: at ~800px the 1.7fr/380px split leaves the
       directory's internal 3-column rows too narrow. */
    .insights-panel.league-detail{grid-template-columns:1fr}
  }

  /* League drill-down: team directory rows — quiet, data-forward.
     .league-directory-row is used ONLY by LeagueTeamDirectoryCard (drill-down), so the
     column ratios below are effectively scoped to this page. */
  .league-directory-row{
    display:grid;grid-template-columns:1.1fr 1fr 1.5fr;gap:12px;align-items:baseline;
    padding:8px 0;border-top:1px solid var(--line2);
  }
  .league-directory-team{
    font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:600;
    color:var(--ink);letter-spacing:0.02em;
  }
  .league-directory-club{font-size:12px;color:var(--ink3)}
  .league-directory-club-link{
    appearance:none;background:none;border:0;padding:0;font:inherit;
    color:var(--green);font-weight:600;cursor:pointer;text-align:left;
  }
  .league-directory-club-link:hover{text-decoration:underline}
  .league-directory-club-link:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:2px}
  .league-directory-contact{
    display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:flex-end;
    font-size:12px;color:var(--muted);text-align:right;
  }
  .league-directory-chair{font-weight:600;color:var(--ink3)}
  .league-directory-contact a{color:var(--ink3);text-decoration:none}
  .league-directory-contact a:hover{color:var(--ink);text-decoration:underline}

  @media (max-width: 768px){
    .insights-bar-row.duo{grid-template-columns:96px 1fr 22px 28px}
    .insights-bar-row.wide-label{grid-template-columns:104px 1fr 44px}
    .league-directory-row{grid-template-columns:1fr;gap:2px}
    .league-directory-contact{justify-content:flex-start;text-align:left}
  }

  .resource-list{display:flex;flex-direction:column;gap:10px;margin-top:2px}
  .resource-row{
    display:flex;align-items:center;gap:14px;
    padding:10px 12px;
    background:var(--paper2);border-radius:10px;
    transition:background .15s ease;
  }
  .resource-row:hover{background:var(--paper3)}
  .resource-num{
    font-family:'Montserrat',sans-serif;font-size:24px;font-weight:800;
    line-height:1;letter-spacing:-0.03em;min-width:34px;
    color:var(--ink);
  }
  .resource-num.warn{color:#6E5618}
  .resource-num.danger{color:#6B1F1A}
  .resource-num.good{color:var(--green)}
  .resource-text{font-size:12px;color:var(--ink3);font-weight:500;line-height:1.4}
  .resource-text strong{color:var(--ink);font-weight:600}

  /* 2 cols below 1360px: three-up cards get too narrow for the dual-value bars.
     The last card spans both columns only when the count is odd (3-card ClubInsights
     panel) — an even set (6-card Insights page) tiles cleanly without it. */
  @media (max-width: 1360px){
    .insights-panel{grid-template-columns:repeat(2,1fr)}
    .insights-panel .insights-card:last-child:nth-child(odd){grid-column:span 2}
  }
  @media (max-width: 768px){
    .insights-panel{grid-template-columns:1fr}
    .insights-panel .insights-card:last-child{grid-column:auto}
  }

  /* ─── GROUND / VENUE LOCATOR ─── */
  .ground-section{margin-top:6px}
  .ground-section-head{margin-bottom:14px}
  .ground-section-title{
    font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;color:var(--ink);
    display:inline-flex;align-items:center;gap:8px;
  }
  .ground-section-title svg{width:16px;height:16px;color:var(--green)}
  .ground-section-sub{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.55;font-weight:500}

  .ground-map-card{
    margin-top:16px;
    background:var(--white);
    border:1px solid var(--line);border-radius:14px;
    overflow:hidden;
    animation:fadeUp .5s cubic-bezier(0.16,1,0.3,1) both;
  }
  .ground-map-head{
    padding:14px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    border-bottom:1px solid var(--line2);
    background:var(--paper);
    flex-wrap:wrap;
  }
  .ground-status{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Montserrat',sans-serif;font-size:10.5px;font-weight:600;
    letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);
  }
  .ground-status .dot{width:6px;height:6px;border-radius:50%;background:var(--muted-3)}
  .ground-status.confirmed{color:var(--green)}
  .ground-status.confirmed .dot{
    background:var(--green-bright);
    animation:pulseDot 2s ease-in-out infinite;
  }
  .ground-meta{
    flex:1;min-width:0;
    font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:600;color:var(--ink);
    text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ground-map-frame{
    position:relative;background:var(--paper2);
  }
  .ground-map{
    width:100%;height:280px;display:block;
    z-index:1;
  }
  /* Signal the map is clickable (click to drop / move the ground pin).
     Leaflet applies .leaflet-container/.leaflet-grab to the .ground-map element
     itself, so these must be compound selectors, not descendants. */
  .ground-map.leaflet-container,
  .ground-map.leaflet-grab{cursor:crosshair}
  .ground-map .leaflet-control-attribution{
    font-size:9px;background:rgba(255,255,255,0.85);font-family:'Montserrat',sans-serif;
  }
  .ground-map .leaflet-control-zoom a{
    background:var(--white);color:var(--ink);
    border-color:var(--line);
    font-family:'Montserrat',sans-serif;font-weight:700;
  }
  .ground-map .leaflet-control-zoom a:hover{background:var(--paper);color:var(--green)}
  /* Custom green pulsing marker */
  .ground-marker{position:relative;width:24px;height:24px}
  .ground-marker::before{
    content:'';position:absolute;left:3px;top:3px;
    width:18px;height:18px;border-radius:50%;
    background:var(--green);border:3px solid #fff;
    box-shadow:0 3px 10px rgba(14,53,41,0.4);
    z-index:2;
  }
  .ground-marker::after{
    content:'';position:absolute;left:0;top:0;
    width:24px;height:24px;border-radius:50%;
    background:rgba(31,170,92,0.35);
    animation:pulseDot 2.2s ease-in-out infinite;
    z-index:1;
  }
  .ground-map-loading{
    position:absolute;inset:0;z-index:5;
    display:flex;align-items:center;justify-content:center;
    background:rgba(248,249,250,0.8);
    backdrop-filter:blur(4px);
    pointer-events:none;
    font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--green);
  }
  .ground-map-loading .spinner{
    width:14px;height:14px;border-radius:50%;
    border:2px solid var(--green-pale);border-top-color:var(--green);
    margin-right:8px;animation:spinSlow .8s linear infinite;
  }
  .ground-coords{
    position:absolute;left:14px;bottom:14px;z-index:2;
    padding:7px 12px;border-radius:99px;
    background:rgba(10,15,20,0.85);color:#fff;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:'Montserrat',sans-serif;font-size:10.5px;font-weight:600;
    letter-spacing:0.1em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:8px;
    pointer-events:none;
  }
  .ground-coords svg{width:13px;height:13px;color:var(--green-bright)}

  @media (max-width: 640px){
    .ground-map{height:220px}
    .ground-map-head{padding:12px 14px;gap:8px}
    .ground-meta{text-align:left;width:100%}
  }

  /* ─── AFFILIATION TWO-COLUMN LAYOUT ─── */
  .aff-layout{
    display:grid;grid-template-columns: 1fr 380px;gap:28px;
    align-items:start;
  }
  .aff-main{min-width:0}
  .aff-side{
    position:sticky;top:80px;
    display:flex;flex-direction:column;gap:14px;
  }
  .aff-hero-card{
    position:relative;border-radius:18px;overflow:hidden;
    height:380px;
    background-size:cover;background-position:center 25%;
    color:#fff;
    box-shadow:0 18px 50px rgba(10,15,20,0.25);
  }
  .aff-hero-card::after{
    content:'';position:absolute;inset:0;z-index:1;
    background:
      linear-gradient(180deg, rgba(10,15,20,0.20) 0%, rgba(10,15,20,0.40) 50%, rgba(10,15,20,0.92) 100%);
  }
  .aff-hero-content{
    position:absolute;inset:0;z-index:2;
    padding:22px 22px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .aff-hero-badge{
    align-self:flex-start;
    display:inline-flex;align-items:center;gap:8px;
    padding:5px 11px;border-radius:14px;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(8px);
    font-family:'Montserrat',sans-serif;font-size:9.5px;font-weight:500;
    letter-spacing:0.16em;text-transform:uppercase;color:#fff;
  }
  .aff-hero-badge .dot{
    width:6px;height:6px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 0 3px rgba(31,170,92,0.25);
  }
  .aff-hero-title{
    font-family:'Montserrat',sans-serif;font-size:24px;font-weight:800;
    line-height:1.1;letter-spacing:-0.01em;color:#fff;
  }
  .aff-hero-title em{color:var(--gold-mid);font-style:normal;font-weight:800}
  .aff-hero-sub{
    font-size:12.5px;color:rgba(255,255,255,0.7);margin-top:8px;line-height:1.55;
  }
  .aff-hero-credit{
    font-family:'Montserrat',sans-serif;font-size:10px;
    letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.55);
    margin-top:12px;
  }
  .aff-hero-credit strong{color:#fff;font-weight:500}

  .aff-summary{
    background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;
  }
  .aff-summary-head{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
  }
  .aff-summary-title{
    font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--ink);
  }
  .aff-summary-step{
    font-family:'Montserrat',sans-serif;font-size:10px;
    color:var(--muted-2);letter-spacing:0.1em;text-transform:uppercase;
  }
  .aff-summary-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 0;border-bottom:1px solid var(--line2);
  }
  .aff-summary-row:last-child{border-bottom:none}
  .aff-summary-label{font-size:11.5px;color:var(--muted);font-family:'Montserrat',sans-serif;letter-spacing:0.04em}
  .aff-summary-value{
    font-family:'Montserrat',sans-serif;font-size:13px;font-weight:600;color:var(--ink);
    text-align:right;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .aff-summary-value.muted{color:var(--muted-2);font-weight:500}
  .aff-summary-foot{
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line2);
    font-size:11px;color:var(--muted-2);font-family:'Montserrat',sans-serif;
    letter-spacing:0.06em;line-height:1.5;
  }
  .aff-summary-foot strong{color:var(--teal-deep);font-weight:600}

  .aff-progress-pill{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;border-radius:10px;
    background:linear-gradient(90deg, rgba(31,170,92,0.06), transparent);
    border:1px solid rgba(31,170,92,0.18);
  }
  .aff-progress-num{
    font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;
    color:var(--teal-deep);line-height:1;letter-spacing:-0.02em;min-width:38px;
  }
  .aff-progress-info{flex:1}
  .aff-progress-label{font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted-2);font-family:'Montserrat',sans-serif}
  .aff-progress-sub{font-size:12.5px;color:var(--ink3);margin-top:1px}

  /* responsive */
  /* ─── RESPONSIVE ─── */

  /* Tablet & smaller laptop (≤ 1100px): collapse two-column patterns */
  @media (max-width: 1100px){

  /* Tablet (≤ 980px): horizontal nav, denser KPIs, stack right rails */
  @media (max-width: 980px){
    /* rows: the horizontal nav keeps its own height; a short page's spare height goes to main
       (otherwise the grid stretches the nav and every nav pill grows ~130px tall) */
    .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .nav{position:relative;top:auto;height:auto;flex-direction:row;overflow-x:auto;padding:10px;border-right:none;border-bottom:1px solid var(--line)}
    .nav-section{display:none}
    .nav-item{white-space:nowrap;padding:8px 12px}
    .nav-footer{display:none}
    .kpi-strip{grid-template-columns:repeat(2,1fr)}
    .score-grid{grid-template-columns:repeat(2,1fr)}
    .phase-track{flex-direction:column}
    .phase-step{border-right:none;border-bottom:1px solid var(--line)}
    .phase-step:last-child{border-bottom:none}
    .ps-cards{grid-template-columns:1fr}
    .ps-title{font-size:32px;line-height:1.1}
    .ps-card{padding:24px 22px}
    .ps-brand-logo{height:78px;padding:12px 18px}
    .hero-banner{height:170px;padding:20px 22px}
    .hero-title{font-size:22px}
    /* admin dashboard 2-col splits (React serialises with a space after the colon) */
    .main [style*="1.4fr 1fr"]{display:flex !important;flex-direction:column;gap:14px !important}
    /* document help / club at-a-glance / outstanding-items 2-col splits */
    .main [style*="1fr 1fr"]:not([style*="1.4fr"]):not([style*="repeat"]){grid-template-columns:1fr !important;display:grid}
    .field-grid-4{grid-template-columns:repeat(2,1fr)}
    .field-grid-3{grid-template-columns:repeat(2,1fr)}
  }

  /* Mobile (≤ 640px): single column everywhere, larger tap targets */
  @media (max-width: 640px){
    html{font-size:14px}
    .app-header{padding:0 14px;gap:10px;height:54px}
    .h-logo-img{height:34px;padding:3px 6px}

    .h-sub{display:none}
    .h-switch{padding:0 9px;font-size:9px;height:28px}

    .h-user-name{font-size:10.5px}
    .h-user-role{font-size:8.5px}
    .h-avatar{width:24px;height:24px;font-size:9px}
    .role-switch{padding:2px;flex-shrink:0}

    /* Page header stacks on mobile */
    .page-head{gap:14px;margin-bottom:18px}

    .deadline{flex-wrap:wrap;padding:12px 14px;gap:10px}

    /* Cards & forms */
    .card-head{padding:14px 16px;flex-wrap:wrap;gap:8px}

    .field-grid-2,.field-grid-3,.field-grid-4{grid-template-columns:1fr}

    /* iOS Safari refuses to zoom-back when an input has font-size < 16px.
       Force 16px on all interactive inputs across the club portal so the page
       NEVER auto-zooms on field focus. Visual size stays tight via padding. */
    .field-input,.field-select,.field-textarea{
      font-size:16px !important;height:46px;padding:0 14px;border-radius:10px;
    }
    .field-textarea{height:auto;min-height:96px;padding:12px 14px;line-height:1.5}
    .field-select{padding-right:38px}

    /* Same fix for any raw <input>/<select> elsewhere (e.g. money inputs, search) */
    input[type="text"],input[type="email"],input[type="tel"],input[type="number"],
    input[type="search"],input[type="date"],input[type="url"],input[type="password"],
    select,textarea{font-size:16px}

    /* "Affiliation submitted" banner — tighten on mobile */
    .aff-submitted-banner{padding:12px 14px;gap:10px;border-radius:12px}
    .aff-submitted-icon{width:36px;height:36px}
    .aff-submitted-icon svg{width:18px;height:18px}
    .aff-submitted-title{font-size:13.5px}
    .aff-submitted-sub{font-size:11px;line-height:1.5;margin-top:3px}

    /* Affiliation form sidebar summary — already hidden but ensure spacing */
    .aff-summary-value{font-size:12.5px}
    .aff-summary-label{font-size:10.5px}

    /* Step strip in affiliation form — make pills tighter */
    .aff-step-strip > div,.aff-step-strip button{padding:8px 10px !important;font-size:11px !important}

    /* Tables — make horizontally scrollable */
    .tbl-w{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tbl{min-width:540px}
    .tbl td,.tbl thead th{padding:9px 10px;font-size:12px}

    /* Pills & filters */
    .filter-row{gap:6px}
    .filter-pill{font-size:11px;padding:0 9px;height:28px}
    .search-box{max-width:none}

    /* Doc rows: stack info + action */
    .doc-row{flex-wrap:wrap;gap:10px;padding:12px 14px}
    .doc-row .doc-info{flex:1 1 100%;order:1}
    .doc-row .doc-icon{order:0}
    .doc-row > .btn,.doc-row > .pill,.doc-row > .doc-row-actions{order:2}
    .doc-row .doc-name{font-size:13px}

    /* Onboarding & exco modals — near full screen */
    .ob-backdrop{padding:12px}
    .ob-modal{width:100%;max-width:100%;max-height:94vh;border-radius:14px}
    .ob-head{padding:14px 18px}
    .ob-body{padding:22px 20px 18px;grid-template-columns:1fr;gap:16px}
    .ob-body .ob-art{width:80px;height:80px;justify-self:flex-start}
    .ob-body .ob-art svg{width:44px;height:44px}
    .ob-title{font-size:22px}
    .ob-foot{padding:12px 16px;gap:8px;flex-wrap:wrap}
    .ob-foot-hint{flex:1 1 100%;text-align:center}

    /* Profile picker */
    .ps-screen{padding:32px 18px;gap:28px}
    .ps-brand-logo{height:64px;padding:10px 14px}
    .ps-title{font-size:26px}
    .ps-desc{font-size:13px}
    .ps-card{padding:20px 18px;gap:14px}
    .ps-card-title{font-size:20px}
    .ps-card-desc{font-size:12.5px}
    .ps-card-meta{gap:12px}
    .ps-card-stat-n{font-size:17px}
    .ps-footer{flex-wrap:wrap;justify-content:center;gap:10px;text-align:center}

    /* CQI questions */
    .cqi-q{grid-template-columns:1fr;gap:10px;padding:12px 14px}
    .cqi-section-w{font-size:10px}

    /* Total score block */
    .total-score-block{flex-direction:column;align-items:flex-start;padding:18px 20px;gap:16px}
    .tsb-num{font-size:48px}

    /* Affiliation step strip — 2x2 instead of 1x4 to keep readable */
    .aff-main > div[style*="display:flex"][style*="gap:0"]{flex-wrap:wrap}
    .aff-main > div[style*="display:flex"][style*="gap:0"] > button{flex:1 1 50% !important;border-right:none !important;border-bottom:1px solid var(--line) !important}
    /* Hide the affiliation sidebar entirely on mobile — context is overkill on a phone */
    .aff-side{display:none}
    .aff-layout{grid-template-columns:1fr;gap:0}

    /* Toast bottom-right → centered bottom */
    .toast{left:14px;right:14px !important;bottom:14px !important;text-align:center}
  }

  }

      .cr-footer {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
      }
      .cr-footer-progress {
        font-family: 'Montserrat', sans-serif;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
      }
      .cr-teams {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      /* Sections keep a stacking context from their fade-in, so lift the one being
         edited — otherwise its suggestion list renders under the next section. */
      .cr-layout .rp-section:focus-within {
        position: relative;
        z-index: 5;
      }
      /* Autofill text field with a suggestion list */
      .cr-ac {
        position: relative;
      }
      .cr-ac.has-list .field-input {
        padding-right: 40px;
      }
      .cr-ac-toggle {
        position: absolute;
        right: 4px;
        top: 4px;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        color: var(--ink);
        border-radius: 6px;
      }
      .cr-ac-toggle:hover {
        background: var(--paper2);
      }
      .cr-ac-toggle svg {
        width: 10px;
        height: 6px;
      }
      .cr-ac-list {
        position: absolute;
        z-index: 20;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        max-height: 260px;
        overflow-y: auto;
        list-style: none;
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 12px 32px rgba(10, 15, 20, 0.12);
        padding: 4px;
      }
      .cr-ac-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 7px;
        font-size: 13px;
        color: var(--ink);
        cursor: pointer;
      }
      .cr-ac-list li:hover,
      .cr-ac-list li.active {
        background: var(--paper2);
      }
      .cr-ac-list li.current {
        font-weight: 700;
      }
      .cr-ac-list li.cr-ac-group {
        cursor: default;
        background: none;
        padding: 8px 10px 4px;
        font-family: 'Montserrat', sans-serif;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .cr-ac-sub {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .cr-fixture-line {
        margin-top: 10px;
        font-size: 12.5px;
        color: var(--ink);
      }
      .cr-fixture-line span {
        color: var(--muted);
      }
      .cr-done-actions {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .cr-aside-card {
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
      }
      .cr-aside-title,
      .cr-guide-title {
        font-family: 'Montserrat', sans-serif;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .cr-aside-match {
        font-family: 'Montserrat', sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        color: var(--ink);
        margin: 8px 0 14px;
        line-height: 1.35;
      }
      .cr-aside-match span {
        display: block;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--muted);
        margin-top: 2px;
      }
      .cr-steps {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 9px;
        margin-bottom: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--line2);
      }
      .cr-steps li {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12.5px;
        color: var(--muted);
        font-weight: 500;
      }
      .cr-steps li.done {
        color: var(--ink);
      }
      .cr-step-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1.5px solid var(--paper3);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .cr-steps li.done .cr-step-dot {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }
      .cr-step-dot svg {
        width: 10px;
        height: 10px;
      }
      .cr-section-head {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 14px;
      }
      .cr-section-head > div:first-child {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .cr-section-sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .cr-avg {
        display: flex;
        align-items: baseline;
        gap: 5px;
      }
      .cr-avg-n {
        font-family: 'Montserrat', sans-serif;
        font-size: 22px;
        font-weight: 800;
        color: var(--green);
        letter-spacing: -0.02em;
      }
      .cr-avg-l {
        font-size: 11px;
        color: var(--muted);
      }
      .cr-guide {
        background: var(--paper);
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 14px 18px;
      }
      .cr-guide > summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .cr-guide > summary::-webkit-details-marker {
        display: none;
      }
      .cr-guide > summary::after {
        content: '+';
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0;
        color: var(--muted);
      }
      .cr-guide[open] > summary::after {
        content: '−';
      }
      .cr-guide-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
        margin-top: 10px;
      }
      .cr-guide-item {
        display: flex;
        gap: 8px;
        font-size: 11px;
        line-height: 1.45;
        color: var(--muted);
      }
      .cr-guide-n {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        background: var(--green);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .cr-guide-n.low {
        background: var(--ink);
      }
      .cr-rate-table {
        margin-top: 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .cr-rate-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 14px;
        border-top: 1px solid var(--line2);
      }
      .cr-rate-headrow {
        border-top: none;
        background: var(--paper);
        padding-top: 8px;
        padding-bottom: 8px;
      }
      .cr-rate-headrow .cr-rate-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .cr-rate-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
      }
      .cr-rate {
        display: flex;
        gap: 6px;
      }
      .cr-rate-scale span {
        width: 34px;
        text-align: center;
        font-size: 10.5px;
        font-weight: 700;
        color: var(--muted);
      }
      .cr-rate-btn {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #fff;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        transition: all 0.12s ease;
      }
      .cr-rate-btn:hover {
        border-color: var(--ink);
        color: var(--ink);
      }
      .cr-rate-btn.on {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }
      .cr-rate-btn.on.low {
        background: var(--ink);
        border-color: var(--ink);
      }
      .cr-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .cr-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 99px;
        border: 1px solid var(--line);
        background: #fff;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        transition: all 0.12s ease;
      }
      .cr-chip:hover {
        color: var(--ink);
        border-color: var(--muted-3);
      }
      .cr-chip.on {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .cr-chip svg {
        width: 11px;
        height: 11px;
      }
      .cr-done {
        max-width: 520px;
        margin: 20px auto 0;
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 36px 32px 28px;
        text-align: center;
      }
      .cr-done-icon {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--green);
        color: #fff;
        display: grid;
        place-items: center;
        margin: 0 auto 14px;
      }
      .cr-done-icon svg {
        width: 22px;
        height: 22px;
      }
      .cr-done-title {
        font-family: 'Montserrat', sans-serif;
        font-size: 20px;
        font-weight: 800;
        color: var(--ink);
      }
      .cr-done-sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 4px;
      }
      .cr-summary {
        margin-top: 22px;
        border: 1px solid var(--line);
        border-radius: 10px;
        text-align: left;
      }
      .cr-summary-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        font-size: 12.5px;
        border-top: 1px solid var(--line2);
      }
      .cr-summary-row:first-child {
        border-top: none;
      }
      .cr-summary-row span {
        color: var(--muted);
      }
      .cr-summary-row strong {
        text-align: right;
      }
      .cr-facts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px 18px;
        margin: 12px 0 0;
      }
      .cr-facts dt {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .cr-facts dd {
        margin: 2px 0 0;
        font-size: 13.5px;
        color: var(--ink);
      }
      .cr-report-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .cr-report-row {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        text-align: left;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--white);
        cursor: pointer;
      }
      .cr-report-row:hover {
        border-color: var(--ink);
      }
      .cr-report-row > span:first-child {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .cr-filters {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .cr-chip-n {
        font-weight: 700;
        margin-left: 4px;
      }
      .cr-range {
        display: flex;
        gap: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .cr-range input {
        width: auto;
        display: inline-block;
      }
      .cr-print {
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px 22px;
      }
      .cr-print-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }
      .cr-print-ref {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .cr-print-umpire {
        border-top: 1px solid var(--line);
        padding-top: 12px;
        margin-top: 12px;
      }
      .cr-print-umpire-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .cr-print-avg {
        margin-left: auto;
        font-weight: 700;
      }
      .cr-print-table {
        border-collapse: collapse;
        width: 100%;
        max-width: 420px;
        font-size: 13px;
      }
      .cr-print-table td {
        padding: 4px 0;
        border-bottom: 1px dashed var(--line);
      }
      .cr-print-table td:last-child {
        text-align: right;
        font-weight: 700;
      }
      .cr-print-table td.low {
        color: var(--coral, #c0392b);
      }
      .cr-print-text {
        white-space: pre-wrap;
        font-size: 13px;
        margin: 8px 0 0;
      }
      .cr-forward-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .cr-forward-pick {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .cr-forward-pick .field-select {
        width: auto;
        min-width: 220px;
        max-width: 100%;
      }
      .cr-unlisted-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .cr-unlisted-grid .field-label {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .cr-delivery {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
      }
      .cr-gaps {
        margin: 0 0 14px;
      }
      .cr-gaps ul {
        margin: 6px 0 0;
        padding-left: 18px;
      }
      .cr-attribute {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 6px 0;
      }
      /* Captain's report pages: readable placeholder and disabled-button text (WCAG AA
         4.5:1) — the global placeholder tint and the 50%-opacity disabled button fall short
         on the public link page, where these carry instructions. */
      .cr-layout .field-input::placeholder,
      .cr-layout .field-textarea::placeholder,
      .cr-link-shell .field-input::placeholder {
        color: #5f6368;
      }
      .cr-layout .btn[disabled],
      .cr-link-shell .btn[disabled] {
        opacity: 1;
        background: #e8eaed;
        border-color: #e8eaed;
        color: #4a4f55;
        box-shadow: none;
      }
      .cr-link-shell {
        min-height: 100vh;
        background: var(--paper, #f6f8fb);
        color: var(--ink, #1b2a4a);
      }
      .cr-link-header {
